# --- SHARED MOD SETTINGS ---
mod_version = 1.0.0
maven_group = com.gatos.mod
archives_base_name = 4Gatos

# --- VERSION SWITCHER ---
# Use the '#' to disable the version you ARE NOT building for.

## [SETTING: MINECRAFT 1.21.11 - Obfuscated]
minecraft_version=1.21.11
# Loom 1.7.4 is the stable standard for 1.21.x
loom_version=1.7.4
loader_version=0.16.10
fabric_version=0.111.0+1.21.11
yarn_mappings=1.21.11+build.1
# Plugin ID for 1.21.11 and below
loom_plugin_id=net.fabricmc.fabric-loom-remap
java_version=21

## [SETTING: MINECRAFT 26.1 - Unobfuscated]
# minecraft_version=26.1
# Loom 1.15.5+ is required for the new unobfuscated system
# loom_version=1.15.5
# loader_version=0.18.4
# fabric_version=0.115.0+26.1
# Plugin ID for 26.1 and above
# loom_plugin_id=net.fabricmc.fabric-loom
# java_version=25

# --- GRADLE SETTINGS ---
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true
